<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eHisobot - Moliyaviy Boshqaruv Tizimi</title>
    <meta http-equiv="refresh" content="0; url=login.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .loader-container {
            text-align: center;
        }
        
        .logo {
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }
        
        .logo svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: fadeIn 0.5s ease 0.2s both;
        }
        
        p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease 0.4s both;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite, fadeIn 0.5s ease 0.6s both;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .redirect-link {
            margin-top: 20px;
            animation: fadeIn 0.5s ease 0.8s both;
        }
        
        .redirect-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid white;
            transition: opacity 0.3s ease;
        }
        
        .redirect-link a:hover {
            opacity: 0.8;
        }
    </style>
    <script>
        // Auto redirect to login page
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 100);
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="logo">
            <svg viewBox="0 0 48 48" fill="none">
                <rect width="48" height="48" rx="12" fill="white" fill-opacity="0.15"/>
                <path d="M24 14L34 20V28L24 34L14 28V20L24 14Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M24 24L34 20M24 24L14 20M24 24V34" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>eHisobot</h1>
        <p>Yuklanmoqda...</p>
        <div class="spinner"></div>
        <div class="redirect-link">
            <p>Agar avtomatik o'tmasa, <a href="login.html">bu yerni bosing</a></p>
        </div>
    </div>
</body>
</html>
