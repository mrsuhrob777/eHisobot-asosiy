<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Professional Design</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Login container -->
    <div class="login-container">
        <!-- Logo section -->
        <div class="logo-section">
            <div class="logo-circle">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="brand-name">Welcome Back</h1>
            <p class="subtitle">Hisobingizga kiring</p>
        </div>

        <!-- Login form -->
        <form class="login-form" id="loginForm">
            <!-- Email input -->
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        autocomplete="email"
                        placeholder=" "
                    >
                    <label for="email">Email manzil</label>
                    <div class="input-border"></div>
                </div>
                <span class="error-message" id="emailError"></span>
            </div>

            <!-- Password input -->
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        autocomplete="current-password"
                        placeholder=" "
                    >
                    <label for="password">Parol</label>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="input-border"></div>
                </div>
                <span class="error-message" id="passwordError"></span>
            </div>

            <!-- Remember & Forgot -->
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="remember">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Eslab qolish</span>
                </label>
                <a href="#" class="forgot-link">Parolni unutdingizmi?</a>
            </div>

            <!-- Submit button -->
            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Kirish</span>
                <span class="btn-loader"></span>
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>yoki</span>
            </div>

            <!-- Social login -->
            <div class="social-login">
                <button type="button" class="social-btn google">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="social-btn github">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </button>
            </div>

            <!-- Sign up link -->
            <div class="signup-section">
                <p>Hisobingiz yo'qmi? <a href="#" class="signup-link">Ro'yxatdan o'tish</a></p>
            </div>
        </form>
    </div>

    <!-- Success message -->
    <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <p>Muvaffaqiyatli kirildi!</p>
    </div>

    <script src="login.js"></script>
</body>
</html>
